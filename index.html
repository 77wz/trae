<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简易商城 - 品质好物，天天低价</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .cart-badge-pop { animation: pop .3s ease; }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.5); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col text-gray-800">

  <!-- ==================== 顶部导航栏 ==================== -->
  <header class="bg-white shadow-sm sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center gap-6">
      <!-- Logo：点击回到首页 -->
      <a href="javascript:;" onclick="goHome()"
         class="text-2xl font-bold text-orange-500 hover:text-orange-600 whitespace-nowrap tracking-wide transition-colors">简易商城</a>

      <!-- 搜索框 + 搜索按钮 -->
      <div class="flex-1 max-w-xl flex">
        <input id="searchInput" type="text" placeholder="搜索商品，例如：苹果"
               class="flex-1 min-w-0 border-2 border-r-0 border-orange-400 rounded-l-md px-4 py-2 text-sm outline-none focus:border-orange-500"
               onkeydown="if(event.key==='Enter') doSearch()" />
        <button onclick="doSearch()"
                class="bg-orange-500 hover:bg-orange-600 text-white px-6 rounded-r-md text-sm font-medium transition-colors">搜索</button>
      </div>

      <!-- 右侧文字链接 -->
      <nav class="flex items-center gap-4 text-sm whitespace-nowrap">
        <a href="javascript:;" class="hover:text-orange-500 hover:underline">你好，请登录</a>
        <a href="javascript:;" class="text-orange-500 hover:text-orange-600 hover:underline">免费注册</a>
        <a href="javascript:;" class="hover:text-orange-500 hover:underline">我的订单</a>
        <a href="javascript:;" onclick="showCart()" class="relative hover:text-orange-500">
          购物车
          <span id="cartBadge"
                class="absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1">0</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- ==================== 分类筛选栏 ==================== -->
  <div class="bg-white border-t border-gray-100">
    <div id="categoryBar" class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap gap-2"></div>
  </div>

  <!-- ==================== 商品列表区域 ==================== -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    <div id="emptyTip" class="hidden text-center text-gray-400 py-20">没有找到相关商品，换个关键词试试吧～</div>
  </main>

  <!-- ==================== 页脚 ==================== -->
  <footer class="bg-white border-t mt-8">
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-wrap justify-center gap-6 text-sm text-gray-500">
      <a href="javascript:;" class="hover:text-orange-500 hover:underline">关于我们</a>
      <a href="javascript:;" class="hover:text-orange-500 hover:underline">联系方式</a>
      <a href="javascript:;" class="hover:text-orange-500 hover:underline">帮助中心</a>
      <span class="w-full text-center text-xs text-gray-400 mt-2">© 2026 简易商城 · 仅供学习演示使用</span>
    </div>
  </footer>

<script>
  // ==================== 模拟商品数据 ====================
  const products = [
    { id: 1, name: '智能手机 Pro 256G 曜石黑',      price: 5999,  category: '手机数码', color: '#e0f2fe', emoji: '📱' },
    { id: 2, name: '无线蓝牙耳机 主动降噪版',        price: 399,   category: '手机数码', color: '#ede9fe', emoji: '🎧' },
    { id: 3, name: '全自动扫地机器人 家用智能',      price: 1299,  category: '家用电器', color: '#e0e7ff', emoji: '🤖' },
    { id: 4, name: '55英寸4K高清智能电视',          price: 1899,  category: '家用电器', color: '#fae8ff', emoji: '📺' },
    { id: 5, name: '男士轻薄羽绒服 冬季新款',        price: 499,   category: '服饰',     color: '#f1f5f9', emoji: '🧥' },
    { id: 6, name: '纯棉圆领卫衣 宽松百搭',          price: 129,   category: '服饰',     color: '#fce7f3', emoji: '👕' },
    { id: 7, name: '新鲜红富士苹果 5斤装',          price: 29.9,  category: '食品生鲜', color: '#fee2e2', emoji: '🍎' },
    { id: 8, name: '冷链三文鱼刺身 中段500g',       price: 88,    category: '食品生鲜', color: '#ccfbf1', emoji: '🐟' }
  ];

  const categories = ['全部', '手机数码', '服饰', '家用电器', '食品生鲜'];
  let activeCategory = '全部';
  let keyword = '';
  let cartCount = 0;

  // ==================== 工具函数：生成 SVG 占位图 ====================
  function placeholder(color, emoji) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
      <rect width="400" height="400" fill="${color}"/>
      <text x="200" y="215" font-size="130" text-anchor="middle">${emoji}</text>
    </svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  // ==================== 渲染分类标签 ====================
  function renderCategories() {
    document.getElementById('categoryBar').innerHTML = categories.map(c => `
      <button onclick="setCategory('${c}')"
              class="px-4 py-1.5 rounded-full text-sm transition-colors
                     ${c === activeCategory
                       ? 'bg-orange-500 text-white font-medium'
                       : 'bg-gray-100 text-gray-600 hover:bg-orange-50 hover:text-orange-500'}">${c}</button>
    `).join('');
  }

  // ==================== 渲染商品列表 ====================
  function renderProducts() {
    const list = products.filter(p =>
      (activeCategory === '全部' || p.category === activeCategory) &&
      (!keyword || p.name.includes(keyword))
    );
    document.getElementById('emptyTip').classList.toggle('hidden', list.length > 0);
    document.getElementById('productGrid').innerHTML = list.map(p => `
      <div class="bg-white rounded-lg overflow-hidden hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200 group">
        <img src="${placeholder(p.color, p.emoji)}" alt="${p.name}" class="w-full aspect-square object-cover" />
        <div class="p-3">
          <h3 class="text-sm text-gray-700 line-clamp-2 h-10 leading-5 cursor-pointer group-hover:text-orange-500" title="${p.name}">${p.name}</h3>
          <div class="mt-2 flex items-center justify-between">
            <span class="text-lg font-bold text-red-500">¥${p.price.toFixed(2)}</span>
            <button onclick="addToCart(${p.id}, this)"
                    class="bg-orange-500 hover:bg-orange-600 active:scale-95 text-white text-xs px-3 py-1.5 rounded-md transition-all disabled:opacity-60">加入购物车</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // ==================== 交互逻辑 ====================
  function setCategory(c) {
    activeCategory = c;
    renderCategories();
    renderProducts();
  }

  function doSearch() {
    keyword = document.getElementById('searchInput').value.trim();
    renderProducts();
  }

  function goHome() {
    keyword = '';
    document.getElementById('searchInput').value = '';
    setCategory('全部');
    window.scrollTo(0, 0);
  }

  function addToCart(id, btn) {
    cartCount++;
    const badge = document.getElementById('cartBadge');
    badge.textContent = cartCount;
    badge.classList.remove('cart-badge-pop');
    void badge.offsetWidth; // 重启动画
    badge.classList.add('cart-badge-pop');
    const old = btn.textContent;
    btn.textContent = '✓ 已加入';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 800);
  }

  function showCart() {
    alert(cartCount > 0 ? `购物车中共有 ${cartCount} 件商品` : '购物车还是空的，快去逛逛吧～');
  }

  // ==================== 初始化 ====================
  renderCategories();
  renderProducts();
</script>
</body>
</html>
